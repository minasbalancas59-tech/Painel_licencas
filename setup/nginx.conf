# =====================================================================
#  nginx para o painel de licencas - licencas.totalscale.com.br
#  Salve como: /etc/nginx/sites-available/licencas
#  Depois: ln -s /etc/nginx/sites-available/licencas /etc/nginx/sites-enabled/
# =====================================================================

server {
    listen 80;
    server_name licencas.totalscale.com.br;

    # o certbot vai preencher o redirect https automaticamente.
    # Ate la, serve por http para validar o certificado.

    root /var/www/licenca;
    index index.php;

    # ----- painel (raiz) -> pasta painel/ ---------------------------
    location / {
        try_files $uri $uri/ /painel/$uri /painel/index.php?$query_string;
    }

    # ----- api -------------------------------------------------------
    location /api/ {
        try_files $uri /api/$uri;
    }

    # ----- PROTECOES CRITICAS ---------------------------------------
    # nunca servir a biblioteca (config.php, licenca.php)
    location ~ ^/api/lib/ { deny all; return 404; }
    location ~ /\.        { deny all; return 404; }

    # arquivos de licenca/chaves nao devem ser baixaveis se por acaso
    # forem parar no webroot
    location ~ \.(bin|dat|key|pem)$ { deny all; return 404; }

    # ----- PHP via php-fpm ------------------------------------------
    # ATENCAO: confira a versao do socket com:  ls /run/php/
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;   # ajuste a versao aqui
    }
}
