server {
    server_name licencas.totalscale.com.br;
    root /var/www/licenca/painel;
    include snippets/totalscale-seguranca.conf;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/ {
        alias /var/www/licenca/api/;

        # lib/ nao e endpoint: config.php e licenca.php sao incluidos
        # pelos scripts, nunca acessados direto. Precisa ficar AQUI
        # dentro - a regex externa nunca e consultada, porque este
        # bloco de prefixo ja resolve a requisicao internamente.
        location ~ /lib/ { deny all; return 404; }

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    location ~ ^/api/lib/ { deny all; return 404; }
    location ~ /\.        { deny all; return 404; }
    location ~ \.(bin|dat|key|pem|bak|bak[0-9]|old|orig|save|swp|sql)$ { deny all; return 404; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/licencas.totalscale.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/licencas.totalscale.com.br/privkey.pem;
}

server {
    listen 80;
    server_name licencas.totalscale.com.br;
    return 301 https://$host$request_uri;
}
